    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
            color: #333;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        .search-box button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .search-box button:hover {
            background-color: #45a049;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .emoji-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            will-change: transform;
        }

        .emoji-card:hover {
            transform: translateY(-5px);
        }

        .emoji-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #f0f0f0;
        }

        .emoji-info {
            padding: 15px;
        }

        .emo-info h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 8px;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .download-btn:hover {
            background-color: #45a049;
        }

        @media (max-width: 768px) {
            .emoji-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .emoji-card img {
                height: 150px;
            }
        }
    </style>
</head>

            let timeout;
            return function executedFunction(...args) {

                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };

        // 随机打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 渲染表情包卡片
        function renderEmojis(emojisToRender = emojis) {
            const emojiGrid = document.getElementById('emojiGrid');
            emojiGrid.innerHTML = '';

            // 随机打乱表情包数组
            const shuffledEmojis = shuffleArray([...emojisToRender]);

            shuffledEmojis.forEach(emoji => {
                const card = document.createElement('div');
                card.className = 'emoji-card';
                card.innerHTML = `
                    <img data-src="${emoji.imageUrl}" alt="${emoji.title}">
                    <div class="emoji-info">
                        <h3>${emoji.title}</h3>
                        <a href="${emoji.downloadUrl}" class="download-btn" download>下载</a>
                    </div>
                `;
                emojiGrid.appendChild(card);

                // 观察新添加的图片
                const img = card.querySelector('img');
                observer.observe(img);
            });
        }

        // 搜索功能（使用防抖）
        const searchEmojis = debounce(() => {
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput.value.toLowerCase();

            const filteredEmojis = emojis.filter(emoji =>
                emoji.title.toLowerCase().includes(searchTerm)
            );

            renderEmojis(filteredEmojis);
        }, 300);

        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {

    <script>
        // 创建全局样式和弹窗结构（兼容移动端）
        document.addEventListener('DOMContentLoaded', function () {
            const style = document.createElement('style');
            style.textContent = `
.meal-alert-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 9999;
    display: none;
}
.meal-alert-box {
    position: relative;
    width: 80%;
    max-width: 300px;
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}
.meal-close-btn {
    display: block;
    margin: 15px auto 0;
    padding: 8px 20px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 12px;
    touch-action: manipulation;
}
`;
            document.head.appendChild(style);

            const alertHTML = `
<div class="meal-alert-mask">
    <div class="meal-alert-box">
        <h3>🍴 用餐时间到！</h3>
        <p>记得及时补充能量哦~</p>
        <div style="display: flex;">
            <button class="meal-close-btn" style="background-color: #ffffff;color: #888888;border: 1px solid #888888;">关闭</button>
            <button class="meal-close-btn meal-open-btn">优惠卷</button>
        </div>
    </div>
</div>
`;
            document.body.insertAdjacentHTML('beforeend', alertHTML);
        });

        // 弹窗控制逻辑 
        const mealAlert = {
            init() {
                this.bindEvents();
                this.startTimer();
                // this.showAlert();
            },

            bindEvents() {
                document.addEventListener('click', (e) => {
                    if (e.target.closest('.meal-close-btn')) {
                        this.hideAlert();
                    }

                    if (e.target.closest('.meal-open-btn')) {
                        gotoPage('https://moyugame965.github.io/Coupon/');
                    }
                });
            },

            showAlert() {
                document.querySelector('.meal-alert-mask').style.display = 'block';
            },

            hideAlert() {
                document.querySelector('.meal-alert-mask').style.display = 'none';
            },

            checkTime() {
                const now = new Date();
                const currentHour = now.getHours();
                const currentMin = now.getMinutes();

                // 在11:00和17:00整点触发，误差控制在1分钟内 
                if ((currentHour === 11 || currentHour === 12 || currentHour === 17 || currentHour === 18) && currentMin === 0) {
                    this.showAlert();
                }
            },

            startTimer() {
                // 每分钟检查一次时间 
                setInterval(() => this.checkTime(), 60000);
                // 初始化立即检查（避免页面打开时正好处于目标时间）
                this.checkTime();
            }
        };

        // 初始化 
        mealAlert.init();
        // setTimeout(() => {
        //     mealAlert.showAlert();
